<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>diagram</title><style>body{margin:0;background:#fff}svg.is-focus .dds-node:not(.on),svg.is-focus .dds-edge:not(.on){opacity:.2}</style></head><body><div id="host"><svg style="background:#fff" xmlns="http://www.w3.org/2000/svg" viewBox="38 74 1254 752" role="img" aria-label="diagram" class="dds-svg"><style>text{font-family:"Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}.dds-label{font-size:14px;font-weight:600}.dds-edge-label{font-size:11.5px}.dds-region-label{font-size:12px;font-weight:600}.m-explain,.m-example{display:none}</style><defs><marker id="ah-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000000"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CF222E"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1A7F37"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969DA"/></marker></defs><g class="dds-edge" data-from="g_db" data-to="collect" data-i="0"><path d="M238,120 L330,120 L330,450 L372,450" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#ah-black)"/></g><g class="dds-edge" data-from="g_log" data-to="collect" data-i="1"><path d="M238,370 L330,370 L330,450 L372,450" fill="none" stroke="#000000" stroke-width="1.6" marker-end="url(#ah-black)"/></g><g class="dds-edge" data-from="g_biz" data-to=    One typed IR → SVG. All examples in the page go through this file. */
(function (global) {
  'use strict';
  var PALETTE = { black: '#000000', white: '#FFFFFF', red: '#CF222E', green: '#1A7F37', blue: '#0969DA' };
  var NS = 'http://www.w3.org/2000/svg';
  var NW = 176, NH = 44;

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

  /* ---------- abstraction: same IR, level-dependent view (ARG-065, §7) ---------- */
  function byId(ir) { var m = {}; ir.nodes.forEach(function (n) { m[n.id] = n; }); return m; }
  var VOPT = {};
  function expanded(n, L) {
    if (VOPT.collapse && VOPT.collapse.indexOf(n.id) >= 0) return false;
    if (VOPT.expand && VOPT.expand.indexOf(n.id) >= 0) return true;
    return n.expandAt === undefined || L >= n.expandAt;

  function visibleAt(n, m, L) {
    var p = n.parent ? m[n.parent] : null;
    while (p) { if (!expanded(p, L)) return false; p = p.parent ? m[p.parent] : null; }
    return true;
  }
  function liftTo(id, m, L) { // nearest visible node (self or ancestor)
    var n = m[id];
    while (n && !visibleAt(n, m, L)) n = m[n.parent];
    // a visible group that is expanded is a region, not an endpoint: keep original
    return n ? n.id : id;
  }
  function view(ir, L, vopt) {
    VOPT = vopt || {};
    if (L === undefined || L === null) return ir;
    var m = byId(ir), nodes = [], groups = [], seen = {}, edges = [];
    ir.nodes.forEach(function (n) {
      if (!visibleAt(n, m, L)) return;
      var isGroup = n.expandAt !== undefined;
      var pos = n.pos ? (n.pos[L] || n.pos[2] || n.pos[1] || n.pos[0]) : [n.x, n.y];
      if (isGroup && (pos[0] === undefined || pos[1] === undefined)) { // R10: no coordinates -> centre of its members
        var kids = ir.nodes.filter(function (k) { var p = k.parent; while (p) { if (p === n.id) return true; p = m[p] && m[p].parent; } return false; })
          .map(function (k) { return k.pos ? (k.pos[2] || k.pos[1] || k.pos[0]) : [k.x, k.y]; }).filter(function (q) { return q[0] !== undefined; });
        if (kids.length) pos = [kids.reduce(function (a, q) { return a + q[0]; }, 0) / kids.length, kids.reduce(function (a, q) { return a + q[1]; }, 0) / kids.length];
        n = Object.assign({}, n, { autoPos: true });
      }
      if (isGroup && expanded(n, L)) { if (n.drawRegion) groups.push({ id: n.id, label: n.label, members: [], certainty: n.certainty, regionDash: n.regionDash, regionWidth: n.regionWidth }); return; }
      var c = Object.assign({}, n, { x: pos[0], y: pos[1], collapsed: isGroup });
      if (isGroup && !c.role) c.role = 'process'; // R2: a collapsed group keeps its own role
      nodes.push(c);
    });
    // region membership: visible descendants of expanded drawRegion groups
    groups.forEach(function (g) {
      nodes.forEach(function (n) { var p = n.parent; while (p) { if (p === g.id) { g.members.push(n.id); break; } p = m[p].parent; } });
    });
    ir.edges.forEach(function (e) {
      var f = liftTo(e.from, m, L), t = liftTo(e.to, m, L);
      if (f === t) return;
      var k = f + '>' + t + (e.loop ? 'L' : '');
      if (seen[k]) return; seen[k] = 1;
      edges.push(Object.assign({}, e, { from: f, to: t }));
    });
    return Object.assign({}, ir, { nodes: nodes, groups: groups, edges: edges, level: L });
  }

  /* ---------- geometry ---------- */
  function textW(t) { var w = 0; String(t).split('').forEach(function (ch) { w += /[\u1100-\u11ff\u3130-\u318f\uac00-\ud7af\u4e00-\u9fff]/.test(ch) ? 14.5 : 8.6; }); return w; }
  function box(n) {
    var w = n.w || NW, h = n.h || NH;
    var need = textW(n.label) + 2 * 18 + (n.collapsed ? 26 : 0) + (n.role === 'entity' ? h / 2 : 0);
    if ((n.collapsed || !n.w) && need > w) w = need; // R13·R16: room for label (and [+]); an explicit w is kept (checked by VB-LABEL-FIT)
    return { x: n.x - w / 2, y: n.y - h / 2, w: w, h: h, cx: n.x, cy: n.y };
  }
  function route(e, m) {
    if (!m[e.from] || !m[e.to]) {
      var miss = !m[e.from] ? e.from : e.to;
      throw new Error('edge ' + e.from + ' -> ' + e.to + ': "' + miss + '"은(는) 이 단계에서 node로 보이지 않는다. 펼친 전체 node(영역)는 edge의 끝점이 될 수 없다. 영역 안의 부분 node를 가리키거나 그 전체를 접어라 (VB-EDGE-ENDPOINT)');
    }
    var s = box(m[e.from]), t = box(m[e.to]);
    var sdx = e.sdx || 0, tdx = e.tdx || 0;
    if (e.route === 'hvh') { // fan-in/out bus: horizontal, vertical at busX, horizontal
      var d1 = t.cx > s.cx ? 1 : -1, ax = s.cx + d1 * s.w / 2, bx = t.cx - d1 * t.w / 2;
      var bus = e.busX !== undefined ? e.busX : (ax + bx) / 2;
      if (Math.abs(s.cy - t.cy) < 1) return { pts: [[ax, s.cy], [bx, t.cy]] };
      return { pts: [[ax, s.cy], [bus, s.cy], [bus, t.cy], [bx, t.cy]] };
    }
    if (Math.abs(s.cy - t.cy) < 1) {
      var dir = t.cx > s.cx ? 1 : -1;
      var a = [s.cx + dir * s.w / 2, s.cy], b = [t.cx - dir * t.w / 2, t.cy];
      if (e.route === 'curve') { var bd = e.bend === undefined ? -40 : e.bend; return { d: 'M' + a + ' C' + [a[0] + dir * 40, a[1] + bd] + ' ' + [b[0] - dir * 40, b[1] + bd] + ' ' + b, pts: [a, b], curve: true }; }
      return { pts: [a, b] };
    }
    var down = t.cy > s.cy ? 1 : -1;
    var sy = s.cy + down * s.h / 2, ty = t.cy - down * t.h / 2;
    var sx = s.cx + sdx, tx = t.cx + tdx;
    if (Math.abs(sx - tx) < 1 && e.route !== 'curve') return { pts: [[sx, sy], [tx, ty]] };
    if (e.route === 'curve') return { d: 'M' + [sx, sy] + ' C' + [sx, (sy + ty) / 2] + ' ' + [tx, (sy + ty) / 2] + ' ' + [tx, ty], pts: [[sx, sy], [tx, ty]], curve: true };
    var my = e.midY !== undefined ? e.midY : (sy + ty) / 2;
    return { pts: [[sx, sy], [sx, my], [tx, my], [tx, ty]] };
  }
  function pathD(r) { return r.d || ('M' + r.pts.map(function (p) { return p.join(','); }).join(' L')); }
  function longestSeg(pts) {
    var best = 0, bi = 0;
    for (var i = 0; i < pts.length - 1; i++) { var l = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); if (l > best) { best = l; bi = i; } }
    return [(pts[bi][0] + pts[bi + 1][0]) / 2, (pts[bi][1] + pts[bi + 1][1]) / 2];
  }
  function longestSeg2(pts, at) {
    var best = -1, bi = 0;
    for (var i = 0; i < pts.length - 1; i++) { var l = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); if (l > best) { best = l; bi = i; } }
    var a = pts[bi], b = pts[bi + 1];
    var u = at === undefined ? 0.5 : at, hz = Math.abs(a[1] - b[1]) < 1;
    if (hz && a[0] > b[0]) { var t = a; a = b; b = t; } // horizontal: measure from the left end
    return { x: a[0] + (b[0] - a[0]) * u, y: a[1] + (b[1] - a[1]) * u, h: hz };
  }
  function dash(c) {
    if (!c || c === 'solid') return '';
    var gap = c === 'dashed' ? 6 : +c;
    return ' stroke-dasharray="6 ' + gap + '"';
  }

  /* ---------- render ---------- */
  function render(irIn, opt) {
    opt = opt || {};
    var ir = view(irIn, opt.level === undefined ? 2 : opt.level, { expand: opt.expand, collapse: opt.collapse });
    var m = byId(ir), W = ir.w || 780, H = ir.h || 400, out = [];
    var vx = 0, vy = 0;
    if (opt.fit) { // bounding box of every drawn element + the same pad on all four sides (cf. Graphviz bb + pad)
      var pad = opt.pad === undefined ? 24 : opt.pad, X = [], Y = [];
      function addBox(x0, y0, x1, y1) { X.push(x0, x1); Y.push(y0, y1); }
      ir.nodes.forEach(function (n) { var b = box(n); addBox(b.x, b.y, b.x + b.w, b.y + b.h);
        if (n.desc || n.example) addBox(b.x, b.y + b.h, b.x + Math.max(b.w, 12 * String(n.desc || n.example).length), b.y + b.h + 22); });
      (ir.groups || []).forEach(function (g) {
        var bs = g.members.map(function (id) { return box(m[id]); }); if (!bs.length) return;
        var gp = g.pad || 16;
        addBox(Math.min.apply(null, bs.map(function (q) { return q.x; })) - gp, Math.min.apply(null, bs.map(function (q) { return q.y; })) - gp - 20,
               Math.max.apply(null, bs.map(function (q) { return q.x + q.w; })) + gp, Math.max.apply(null, bs.map(function (q) { return q.y + q.h; })) + gp + (ir.regionExtra || 0));
      });
      ir.edges.forEach(function (e) { var r = route(e, m); r.pts.forEach(function (q) { addBox(q[0] - 6, q[1] - 6, q[0] + 6, q[1] + 6); });
        if (e.label) { var ls = longestSeg2(r.pts, e.labelAt), tw = e.label.length * 11 + 8; addBox(ls.x - tw / 2 - 10, ls.y - 24, ls.x + tw + 12, ls.y + 12); } });
      vx = Math.min.apply(null, X) - pad; vy = Math.min.apply(null, Y) - pad;
      W = Math.max.apply(null, X) + pad - vx; H = Math.max.apply(null, Y) + pad - vy;
    }
    out.push('<svg xmlns="' + NS + '" viewBox="' + vx + ' ' + vy + ' ' + W + ' ' + H + '" role="img" aria-label="' + esc(ir.title || 'diagram') + '" class="dds-svg">');
    out.push('<defs>');
    Object.keys(PALETTE).forEach(function (k) {
      out.push('<marker id="ah-' + k + (opt.uid || '') + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="' + PALETTE[k] + '"/></marker>');
    });
    out.push('</defs>');
    // regions (whole_part)
    (ir.groups || []).forEach(function (g) {
      var bs = g.members.map(function (id) { return box(m[id]); });
      if (!bs.length) return;
      var pad = g.pad || 16, extra = ir.regionExtra || 0;
      var x0 = Math.min.apply(null, bs.map(function (b) { return b.x; })) - pad;
      var y0 = Math.min.apply(null, bs.map(function (b) { return b.y; })) - pad - 20;
      var x1 = Math.max.apply(null, bs.map(function (b) { return b.x + b.w; })) + pad;
      var y1 = Math.max.apply(null, bs.map(function (b) { return b.y + b.h; })) + pad + extra;
      out.push('<g class="dds-region" data-id="' + g.id + '"><rect x="' + x0 + '" y="' + y0 + '" width="' + (x1 - x0) + '" height="' + (y1 - y0) + '" fill="none" stroke="#000" stroke-width="' + (g.regionWidth || 1) + '"' + (g.certainty && g.certainty !== 'solid' ? ' stroke-dasharray="' + (g.regionDash || '2 6') + '"' : '') + '/>' +
        '<text x="' + (x0 + 10) + '" y="' + (y0 + 16) + '" class="dds-region-label">' + esc(g.label) + '</text></g>');
    });
    // edges
    var FR = opt.focus ? reach(ir, opt.focus) : null; // R18: static emphasis (one flow per sheet)
    function dimAttr(on) { return FR && !on ? ' opacity="0.16"' : ''; }
    ir.edges.forEach(function (e, i) {
      var r = route(e, m), c = e.color || 'black';
      var mk = e.arrow === false ? '' : ' marker-end="url(#ah-' + c + (opt.uid || '') + ')"';
      out.push('<g class="dds-edge' + (e.loop ? ' is-loop' : '') + '" data-from="' + e.from + '" data-to="' + e.to + '" data-i="' + i + '"' + dimAttr(FR && FR.edges[i]) + '>' +
        '<path d="' + pathD(r) + '" fill="none" stroke="' + col(c) + '" stroke-width="' + (e.width || 1.6) + '"' + dash(e.certainty) + mk + '/>');
      if (e.label) { // placed beside the line so certainty dashes stay visible
        var ls = longestSeg2(r.pts, e.labelAt), tw = e.label.length * 11 + 8;
        if (ls.h) out.push('<rect x="' + (ls.x - tw / 2) + '" y="' + (ls.y - 21) + '" width="' + tw + '" height="17" fill="#fff"/>' +
          '<text x="' + ls.x + '" y="' + (ls.y - 8) + '" text-anchor="middle" class="dds-edge-label">' + esc(e.label) + '</text>');
        else out.push('<rect x="' + (ls.x + 5) + '" y="' + (ls.y - 9) + '" width="' + tw + '" height="17" fill="#fff"/>' +
          '<text x="' + (ls.x + 9) + '" y="' + (ls.y + 4) + '" class="dds-edge-label">' + esc(e.label) + '</text>');
      }
      out.push('</g>');
    });
    // nodes
    ir.nodes.forEach(function (n) {
      var b = box(n), stroke = col(n.color || (n.kind && ir.legend && ir.legend[n.kind] ? ir.legend[n.kind].color : 'black'));
      var fill = n.fill ? col(n.fill) : '#FFFFFF';
      var ink = n.fill && n.fill !== 'white' ? '#FFFFFF' : '#000000';
      var rx = n.role === 'entity' ? b.h / 2 : (n.rounded ? 8 : 0);
      var sw = n.role === 'process' && n.kind ? 2.2 : 1.6;
      out.push('<g class="dds-node" data-id="' + n.id + '" tabindex="0"' + dimAttr(FR && FR.nodes[n.id]) + '>' +
        '<rect x="' + b.x + '" y="' + b.y + '" width="' + b.w + '" height="' + b.h + '" rx="' + rx + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + sw + '"/>' +
        '<text x="' + (n.collapsed ? b.cx - 13 : b.cx) + '" y="' + (b.cy + 5) + '" text-anchor="middle" class="dds-label" fill="' + ink + '">' + esc(n.label) + (n.collapsed ? '' : '') + '</text>');
      if (n.collapsed) {
        var px = n.role === 'entity' ? b.x + b.w - b.h / 2 - 12 : b.x + b.w - 22, py = b.y + (b.h - 18) / 2; // keep [+] inside the shape
        if (n.role !== 'entity') py = b.y + 4;
        out.push('<g class="dds-plus" data-expand="' + n.id + '"><rect x="' + px + '" y="' + py + '" width="18" height="18" fill="#fff" stroke="#000"/>' +
          '<path d="M' + (px + 5) + ',' + (py + 9) + ' h8 M' + (px + 9) + ',' + (py + 5) + ' v8" stroke="#000" stroke-width="1.6"/></g>');
      }
      if (n.desc) out.push('<text x="' + (b.x + 2) + '" y="' + (b.y + b.h + 17) + '" class="dds-desc m-explain">' + esc(n.desc) + '</text>');
      if (n.example) out.push('<text x="' + (b.x + 2) + '" y="' + (b.y + b.h + 17) + '" class="dds-example m-example">' + esc(n.example) + '</text>');

  /* ---------- hover: Input→Output related flow (ARG-023/024) ---------- */
  function reach(ir, id) {
    var fwd = {}, back = {}, on = {}, edges = {};
    ir.edges.forEach(function (e, i) { if (e.loop) return; (fwd[e.from] = fwd[e.from] || []).push([e.to, i]); (back[e.to] = back[e.to] || []).push([e.from, i]); });
    function walk(g, start) { var st = [start]; while (st.length) { var x = st.pop(); (g[x] || []).forEach(function (p) { edges[p[1]] = 1; if (!on[p[0]]) { on[p[0]] = 1; st.push(p[0]); } }); } }
    on[id] = 1; walk(fwd, id); walk(back, id);
